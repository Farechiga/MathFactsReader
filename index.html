<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aussie Math Facts!</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="practice-panel" aria-label="Aussie Math Facts practice controls">
        <div class="brand-row">
          <img class="brand-logo" src="./Assets/aussie_math_facts_logo.png" alt="Aussie Math Facts logo">
        </div>

        <div class="controls-row" aria-label="Playback controls">
          <button class="primary-action" id="playButton" type="button">Play</button>
          <button class="secondary-action" id="pauseButton" type="button" disabled>Pause</button>
        </div>

        <div class="tempo-control">
          <div>
            <label for="pauseRange">Pause between facts</label>
          </div>
          <input id="pauseRange" type="range" min="300" max="5000" step="100" value="2800">
          <span id="pauseValue">2.8 sec</span>
        </div>

        <div>
          <p class="section-label">Practice mode</p>
          <div class="mode-grid" id="modeButtons" aria-label="Choose math fact set"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
