<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Math Facts Reader</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="practice-panel" aria-label="Math Facts practice controls">
        <div class="brand-row">
          <img class="brand-logo" src="./Assets/math_facts_logo.png" alt="Math Facts Reader logo">
        </div> 

        <div class="controls-row" aria-label="Playback controls">
          <button class="primary-action" id="playButton" type="button">Play</button>
          <button class="secondary-action" id="pauseButton" type="button" disabled>Pause</button>
        </div>

        <div class="voice-control">
          <p class="section-label">Voice</p>
          <div class="voice-grid" id="voiceButtons" aria-label="Choose narrator voice">
            <button class="voice-button" type="button" data-voice="random">Random</button>
            <button class="voice-button active" type="button" data-voice="google">Flynn</button>
            <button class="voice-button" type="button" data-voice="tom">Tom</button>
            <button class="voice-button" type="button" data-voice="louise">Louise</button>
            <button class="voice-button" type="button" data-voice="tanmoy">Tanmoy</button>
            <button class="voice-button" type="button" data-voice="lilian">Lilian</button>
            <button class="voice-button" type="button" data-voice="drrosso">Dr. Rosso</button>
            <button class="voice-button" type="button" data-voice="clay">Clay</button>
            <button class="voice-button" type="button" data-voice="savannah">Savannah</button>
            <button class="voice-button" type="button" data-voice="charlotte">Charlotte</button>
            <button class="voice-button" type="button" data-voice="waldeck">Waldeck</button>
            <button class="voice-button" type="button" data-voice="adeya">Adeya</button>
            <button class="voice-button" type="button" data-voice="cosimo">Cosimo</button>
            <button class="voice-button" type="button" data-voice="callum">Callum</button>
            <button class="voice-button" type="button" data-voice="miri">Miri</button>
          </div>
        </div>

        <div class="tempo-control">
          <div>
            <label for="pauseRange">Pause between facts</label>
          </div>
          <input id="pauseRange" type="range" min="300" max="5000" step="100" value="2800">
          <span id="pauseValue">2.8 sec</span>
        </div>

        <div>
          <p class="section-label">Practice mode</p>
          <div class="mode-grid" id="modeButtons" aria-label="Choose math fact set"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
